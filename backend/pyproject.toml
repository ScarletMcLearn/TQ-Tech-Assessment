[project]
name = "ai-email-reading-agent-backend"
version = "1.0.0"
description = "FastAPI backend for the TQTech AI email reading agent assessment."
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "SQLAlchemy==2.0.50",
    "pydantic-settings==2.14.1",
    "openai==2.41.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"app/routes/**/*.py" = ["B008"]
"tests/**/*.py" = ["B011"]
